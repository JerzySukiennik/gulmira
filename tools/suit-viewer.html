<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Suit Viewer</title>
<style>html,body{margin:0;height:100%;background:#1a1b1e;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.js", "three/addons/": "../vendor/addons/" } }</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildMk3, SUIT_DETAIL_GLSL as D } from '../src/suit/mk3.js';

const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(2, devicePixelRatio));
const VW = innerWidth > 200 ? innerWidth : 1280, VH = innerHeight > 200 ? innerHeight : 720;
r.setSize(VW, VH);
r.toneMapping = THREE.ACESFilmicToneMapping;
r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true;
r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#202126');
const pm = new THREE.PMREMGenerator(r);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight(0xfff1e0, 2.2);
key.position.set(-2.5, 4, -3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = key.shadow.camera.bottom = -1.5;
key.shadow.camera.right = key.shadow.camera.top = 1.5;
key.shadow.bias = -0.0002;
scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe0ff, 1.6);
rim.position.set(3, 2.5, 3);
scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(4, 64), new THREE.MeshStandardMaterial({ color: '#3a3b40', roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);
const suit = buildMk3();
const mats = new Set(); suit.traverse(o => { if (o.isMesh) mats.add(o.material); });
for (const m of mats) {
  if (!(m.isMeshPhysicalMaterial || m.isMeshStandardMaterial)) continue;
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\n' + D.vertPars).replace('#include <begin_vertex>', '#include <begin_vertex>\n' + D.vert);
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\n' + D.fragPars)
      .replace('#include <normal_fragment_maps>', '#include <normal_fragment_maps>\n' + D.frag)
      .replace('#include <lights_physical_fragment>', '#include <lights_physical_fragment>\n' + D.clearcoat);
  };
  m.needsUpdate = true;
}
scene.add(suit);
const B = suit.userData.bones;
const params = new URLSearchParams(location.search);
const pose = params.get('pose') || 'a';
if (pose === 'a') {
  B.shoulder_R.rotation.z = 0.12; B.shoulder_L.rotation.z = -0.12;
  B.elbow_R.rotation.x = -0.25; B.elbow_L.rotation.x = -0.25;
  B.hip_R.rotation.z = 0.04; B.hip_L.rotation.z = -0.04;
  for (const s of ['R', 'L']) for (const f of Object.values(B['fingers_' + s])) f.forEach((b, i) => { if (!b.name.startsWith('thumb')) b.rotation.z = (s === 'R' ? 1 : -1) * 0.25 * (i + 1) * 0.5; });
}
const cam = new THREE.PerspectiveCamera(30, VW / VH, 0.05, 50);
const views = {
  front: [[0, 1.1, -4.6], [0, 1.0, 0]],
  three: [[-2.6, 1.4, -3.6], [0, 1.0, 0]],
  side: [[4.4, 1.1, 0], [0, 1.0, 0]],
  back: [[0, 1.2, 4.6], [0, 1.0, 0]],
  back34: [[2.3, 1.6, 3.3], [0, 1.15, 0]],
  backtorso: [[0.35, 1.5, 1.75], [0, 1.28, 0]],
  backhead: [[0.25, 1.85, 0.95], [0, 1.68, 0]],
  tpp: [[0.0, 2.25, 3.5], [0, 1.45, 0]],
  head: [[-0.45, 1.85, -0.85], [0, 1.78, 0]],
  headside: [[0.9, 1.8, -0.25], [0, 1.78, 0]],
  torso: [[-0.7, 1.45, -1.7], [0, 1.3, 0]],
  hand: [[0.6, 1.0, -0.55], [0.2, 0.86, 0]],
  legs: [[-1.0, 0.6, -2.0], [0, 0.45, 0]],
};
const v = views[params.get('view') || 'three'];
cam.position.set(...v[0]);
const ctl = new OrbitControls(cam, r.domElement);
ctl.target.set(...v[1]);
ctl.update();
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
let tris = 0; suit.traverse(o => { if (o.isMesh) tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
window.__suit = { suit, tris, B, scene, cam, r };
const loop = () => { ctl.update(); r.render(scene, cam); requestAnimationFrame(loop); };
loop();
</script>
</body>
</html>
